<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>モック: パスワードリセット実行画面</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          gray: { 50:'#F8F9FA',100:'#F1F3F5',200:'#E9ECEF',300:'#DEE2E6',400:'#ADB5BD',500:'#868E96',600:'#495057',700:'#343A40',900:'#212529' },
          primary: { 50:'#EEF3FB',100:'#D6E2F5',500:'#3A6EA5',600:'#2F5A87',700:'#254669' },
          success: { 500:'#2F9E5B' },
          warning: { 500:'#C97A1F' },
          error: { 500:'#C0392B' },
        },
        fontFamily: {
          sans: ['-apple-system','BlinkMacSystemFont','Hiragino Sans','Noto Sans JP','Yu Gothic UI','sans-serif'],
        },
        borderRadius: { sm: '6px', md: '10px', lg: '16px' },
        boxShadow: {
          sm: '0 1px 2px rgba(33, 37, 41, 0.06)',
          md: '0 4px 12px rgba(33, 37, 41, 0.08)',
        },
        screens: { tablet: '768px', desktop: '1280px' },
      }
    }
  }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-700 text-base leading-[1.6]">

<div class="max-w-5xl mx-auto px-6 py-12 space-y-16">

  <header class="text-center space-y-1">
    <p class="text-sm text-gray-500">モック(状態バリエーション確認用)</p>
    <h1 class="text-2xl font-semibold text-gray-900">パスワードリセット実行画面</h1>
  </header>

  <!-- 正常状態 -->
  <section class="space-y-3">
    <h2 class="text-sm font-medium text-gray-500">正常状態</h2>
    <div class="max-w-[400px] mx-auto bg-white rounded-lg shadow-sm border border-gray-200 p-8 space-y-6">
      <div class="text-center space-y-1">
        <p class="text-lg font-semibold text-gray-900">新しいパスワードを設定</p>
      </div>

      <form class="space-y-4">
        <div class="space-y-1.5">
          <label class="text-sm font-medium text-gray-700">新しいパスワード</label>
          <input type="password" placeholder="8文字以上"
            class="w-full h-11 px-3 rounded-sm border border-gray-300 text-base placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
        </div>
        <div class="space-y-1.5">
          <label class="text-sm font-medium text-gray-700">新しいパスワード(確認)</label>
          <input type="password" placeholder="もう一度入力してください"
            class="w-full h-11 px-3 rounded-sm border border-gray-300 text-base placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
        </div>

        <button type="button" class="w-full h-11 rounded-sm bg-primary-500 text-white font-medium hover:bg-primary-600 active:bg-primary-700 transition-colors">
          パスワードを変更
        </button>
      </form>
    </div>
  </section>

  <!-- ローディング状態 -->
  <section class="space-y-3">
    <h2 class="text-sm font-medium text-gray-500">ローディング状態</h2>
    <div class="max-w-[400px] mx-auto bg-white rounded-lg shadow-sm border border-gray-200 p-8 space-y-6">
      <div class="text-center space-y-1">
        <p class="text-lg font-semibold text-gray-900">新しいパスワードを設定</p>
      </div>
      <form class="space-y-4">
        <div class="space-y-1.5">
          <label class="text-sm font-medium text-gray-700">新しいパスワード</label>
          <input type="password" value="••••••••" disabled class="w-full h-11 px-3 rounded-sm border border-gray-300 text-base bg-gray-50 text-gray-500">
        </div>
        <div class="space-y-1.5">
          <label class="text-sm font-medium text-gray-700">新しいパスワード(確認)</label>
          <input type="password" value="••••••••" disabled class="w-full h-11 px-3 rounded-sm border border-gray-300 text-base bg-gray-50 text-gray-500">
        </div>
        <button type="button" disabled class="w-full h-11 rounded-sm bg-primary-500/70 text-white font-medium flex items-center justify-center gap-2 cursor-not-allowed">
          <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-30" cx="12" cy="12" r="10" stroke="white" stroke-width="4"></circle>
            <path class="opacity-90" fill="white" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          変更中…
        </button>
      </form>
    </div>
  </section>

  <!-- エラー状態(リンク無効・期限切れ) -->
  <section class="space-y-3">
    <h2 class="text-sm font-medium text-gray-500">エラー状態(リンクが無効・期限切れ。要件定義書に明記のない箇所を補完 — screens.md未決事項参照)</h2>
    <div class="max-w-[400px] mx-auto bg-white rounded-lg shadow-sm border border-gray-200 p-8 space-y-4 text-center">
      <div class="w-10 h-10 mx-auto rounded-full bg-error-500/10 flex items-center justify-center text-error-500">⚠</div>
      <p class="text-gray-900 font-medium">リンクが無効か、有効期限が切れています</p>
      <p class="text-sm text-gray-500">お手数ですが、もう一度パスワードリセットを申請してください。</p>
      <a href="password-reset-request.html" class="inline-block text-sm text-primary-500 hover:underline pt-1">パスワードリセットを再度申請する</a>
    </div>
  </section>

  <footer class="text-center text-xs text-gray-400 pt-4">
    docs/design/screens.md「4. パスワードリセット実行画面」に対応
  </footer>

</div>
</body>
</html>
